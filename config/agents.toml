version = 2
default = "codex"

[[commands]]
name = "codex"
agent = "codex"
command = "codex"

[[commands]]
name = "claude"
agent = "claude"
command = "claude"

[[commands]]
name = "opencode"
agent = "opencode"
command = "opencode"

[[commands]]
name = "ocq"
agent = "opencode"
# The shell alias wraps ollama launch. Forward agent arguments after --.
command = "ocq --"

[[commands]]
name = "sol-light"
agent = "codex"
command = """codex -m gpt-6.2-sol -c 'model_reasoning_effort="low"'"""
shortcut = "Enter+L"

[[commands]]
name = "sol-ultra"
agent = "codex"
command = """codex -m gpt-6.2-sol -c 'model_reasoning_effort="ultra"'"""
shortcut = "Enter+U"
