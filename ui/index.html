<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minterm</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="preload" href="/fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/agents.css" />
    <script defer src="/vendor/xterm.js"></script>
    <script defer src="/vendor/addon-fit.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header id="titlebar">
      <div id="tablist" role="tablist" aria-label="Terminal tabs"></div>
      <div class="new-tab-actions">
        <button
          id="new-tab"
          class="icon"
          title="New terminal tab (⌘T)"
          aria-label="New terminal tab"
        >
          <i data-icon="plus"></i>
        </button>
        <details id="new-tab-options">
          <summary aria-label="New tab options" title="New tab options">
            <i data-icon="chevron"></i>
          </summary>
          <div class="tab-choices">
            <button id="new-terminal-tab" type="button">New terminal tab</button>
            <button id="new-agent-tab" type="button">New agent tab</button>
          </div>
        </details>
      </div>
      <div class="drag-space"></div>
      <div class="tools">
        <button
          id="command-toggle"
          class="icon"
          type="button"
          title="Agent mode"
          aria-label="Agent mode"
          aria-pressed="false"
          aria-controls="command-form terminals"
          disabled
        >
          <i data-icon="robot"></i>
        </button>
        <button
          id="inspector-toggle"
          class="icon"
          title="Local inspector (⌘I)"
          aria-label="Local inspector"
          aria-controls="inspect-panel"
          aria-pressed="true"
        >
          <i data-icon="panel"></i>
        </button>
      </div>
    </header>
    <main>
      <section class="workspace" aria-label="Terminal workspace">
        <div id="terminals">
          <form id="command-form" aria-label="Agent prompt" hidden>
            <label id="command-marker" for="command-input"><i data-icon="robot"></i></label>
            <textarea
              id="command-input"
              rows="1"
              maxlength="4000"
              spellcheck="false"
              autocapitalize="off"
              autocomplete="off"
              aria-label="Initial agent task"
              aria-keyshortcuts="Enter Shift+Enter Escape"
            ></textarea>
          </form>
        </div>
        <div id="exit-note" hidden><span></span><button id="restart">Open new shell</button></div>
      </section>
      <aside id="sidebar" aria-label="Tools">
        <section id="inspect-panel" class="panel">
          <div class="panel-header">
            <h1>Local inspector</h1>
            <button
              id="refresh"
              class="icon"
              title="Refresh inspector"
              aria-label="Refresh inspector"
            >
              <i data-icon="refresh"></i>
            </button>
          </div>
          <div class="panel-scroll">
            <div class="agent-section-tools">
              <button
                id="start-agent"
                class="icon"
                type="button"
                title="Start agent"
                aria-label="Start agent"
                aria-haspopup="dialog"
                aria-controls="agent-launch"
              >
                <i data-icon="plus"></i>
              </button>
            </div>
            <details id="agent-section" open>
              <summary>
                <i data-icon="agents"></i><span>Agents</span
                ><span class="count" id="agent-count"></span><i data-icon="chevron"></i>
              </summary>
              <ul class="rows" id="agents" aria-label="Agent sessions"></ul>
              <p class="empty" id="agent-empty">Checking sessions…</p>
            </details>
            <details id="port-section">
              <summary>
                <i data-icon="ports"></i><span>Ports</span
                ><span class="count" id="port-count"></span><i data-icon="chevron"></i>
              </summary>
              <div class="filters" role="group" aria-label="Port filter">
                <button id="dev-filter" aria-pressed="true">Development</button
                ><button id="all-filter" aria-pressed="false">All ports</button>
              </div>
              <ul class="rows" id="ports" aria-label="Listening ports"></ul>
              <p class="empty" id="port-empty">Checking listeners…</p>
              <p class="empty" id="service-errors" hidden></p>
            </details>
          </div>
        </section>
      </aside>
    </main>
    <div id="notice" role="status" hidden></div>
    <dialog id="agent-launch" class="agent-dialog" aria-labelledby="agent-launch-title">
      <form id="agent-launch-form">
        <h2 id="agent-launch-title">Start agent</h2>
        <div>
          <label for="agent-choice">Agent</label>
          <select id="agent-choice" name="agent" required></select>
        </div>
        <div>
          <label for="agent-prompt">Task</label>
          <textarea
            id="agent-prompt"
            rows="4"
            maxlength="4000"
            required
            spellcheck="false"
          ></textarea>
        </div>
        <div class="dialog-buttons">
          <button type="button" class="secondary" id="agent-cancel">Cancel</button>
          <button
            type="submit"
            class="primary"
            id="agent-submit"
            aria-keyshortcuts="Meta+Enter"
            disabled
          >
            Start agent <kbd aria-hidden="true">⌘↵</kbd>
          </button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dialog-buttons">
        <button id="cancel" class="secondary" autofocus>Cancel</button
        ><button id="confirm-close" class="danger">Close</button>
      </div>
    </dialog>
  </body>
</html>
