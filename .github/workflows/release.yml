name: Release macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-macos
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [[ ! $previous =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag, got $previous" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          base=$(git rev-parse "refs/tags/$previous^{commit}")
          if git merge-base --is-ancestor HEAD "$base"; then
            echo "This commit is already included in $previous."
            exit 0
          fi
          changes=$(git diff --name-only "$base" HEAD -- Cargo.toml Cargo.lock build.rs config macos shell src ui)
          if [[ -z $changes ]]; then
            echo "No app changes since $previous."
            exit 0
          fi
          marker=$(git log -1 --format=%H --fixed-strings --grep='[release major]' "$base..HEAD")
          if [[ -n $marker ]]; then
            version="$((major + 1)).0.0"
          else
            version="$major.$minor.$((patch + 1))"
          fi
          printf 'number=%s\nprevious=%s\n' "$version" "$previous" >> "$GITHUB_OUTPUT"
      - name: Test and package
        if: steps.version.outputs.number != ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # Stamp the runner's checkout before building and signing the bundle.
          sed -i '' -e '/^\[package\]/,/^\[/ s/^version = .*/version = "'"$RELEASE_VERSION"'"/' Cargo.toml
          sed -i '' -e '/^name = "minterm"$/ { n; s/^version = .*/version = "'"$RELEASE_VERSION"'"/; }' Cargo.lock
          plutil -replace CFBundleShortVersionString -string "$RELEASE_VERSION" macos/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" macos/Info.plist
          cargo test --locked
          ./macos/bundle.sh --dmg
      - name: Publish release
        if: steps.version.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous }}
        run: |
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --generate-notes --notes-start-tag "$PREVIOUS_TAG" \
            dist/Minterm-arm64.dmg
