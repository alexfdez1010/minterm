name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw -o - macos/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Test and package
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --locked
          ./macos/bundle.sh
          test "$(lipo -archs dist/Minterm.app/Contents/MacOS/minterm)" = arm64
          ditto -c -k --keepParent dist/Minterm.app dist/Minterm-arm64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes dist/Minterm-arm64.zip
