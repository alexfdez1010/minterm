name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v5
      - name: Check release version
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw -o - macos/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Test and package
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo test --locked
          ./macos/bundle.sh
          test "$(lipo -archs dist/Minterm.app/Contents/MacOS/minterm)" = "${{ matrix.arch }}"
          ditto -c -k --keepParent dist/Minterm.app "dist/Minterm-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Minterm-${{ matrix.arch }}
          path: dist/Minterm-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Minterm-*
          merge-multiple: true
      - name: Publish both builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes Minterm-arm64.zip Minterm-x86_64.zip
